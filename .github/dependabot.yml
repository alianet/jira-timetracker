version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /.docker/php
    schedule:
      interval: weekly
    groups:
      php-image-dependencies:
        patterns:
          - "*"
